<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Studio UI v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="/prototype/hark.css" />
    <link rel="stylesheet" href="/prototype/hark-hero.css" />
    <style>
      :root { color-scheme: light; }
      .x-root {
        --x-ink: #171717; --x-ink-2: #525252; --x-ink-3: #737373;
        --x-line: #ebebeb; --x-soft: #f5f5f5; --x-hover: #f0f0f0; --x-side: #fafafa;
        --x-accent: #5e5ce6; --x-accent-ink: #4f4dd6;
        --x-green: #16a34a; --x-amber: #d97706; --x-grey: #a3a3a3;
        --x-r: 6px; --x-r2: 10px;
        --x-ease: cubic-bezier(.23, 1, .32, 1);
        font-family: "Geist", system-ui, sans-serif;
        color: var(--x-ink); background: #fff;
        font-size: 14px; line-height: 1.5; font-weight: 400;
        min-height: 100vh;
      }
      .x-root *, .x-root *::before, .x-root *::after { box-sizing: border-box; }
      :where(.x-root) :where(button) { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
      .x-root input, .x-root textarea { font: inherit; color: inherit; }
      .x-root h1, .x-root h2, .x-root h3 { font-weight: 500; letter-spacing: -0.01em; line-height: 1.3; }
      .x-root b, .x-root strong { font-weight: 500; }
      .x-num { font-variant-numeric: tabular-nums; }
      .x-mono { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; }
      .x-ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .x-ico--s { width: 14px; height: 14px; }
      .x-ico--l { width: 20px; height: 20px; }

      /* ---------- app shell ---------- */
      .x-app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }

      /* ---------- sidebar ---------- */
      .x-side { background: var(--x-side); border-right: 1px solid var(--x-line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; position: sticky; top: 0; height: 100vh; }
      .x-logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
      .x-logo__mark { width: 24px; height: 24px; border-radius: var(--x-r); background: var(--x-ink); color: #fff; display: grid; place-items: center; }
      .x-logo__mark .x-ico { width: 14px; height: 14px; }
      .x-logo__name { font-weight: 500; font-size: 14px; line-height: 1.2; }
      .x-logo__sub { font-size: 12px; color: var(--x-ink-3); line-height: 1.3; }
      .x-side__label { font-size: 12px; color: var(--x-ink-3); padding: 14px 8px 4px; }
      .x-navi { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 6px 8px; border-radius: var(--x-r); color: var(--x-ink-2); font-size: 13px; text-align: left; transition: background .15s, color .15s; }
      .x-navi:hover { background: var(--x-hover); color: var(--x-ink); }
      .x-navi.is-active { background: var(--x-hover); color: var(--x-ink); font-weight: 500; }
      .x-navi.is-active .x-ico { color: var(--x-accent); }
      .x-navi__count { margin-left: auto; font-size: 12px; color: var(--x-ink-3); font-weight: 400; font-variant-numeric: tabular-nums; }
      .x-navi__count--hot { color: var(--x-accent); font-weight: 500; }
      .x-side__spacer { flex: 1; min-height: 16px; }
      .x-user { display: flex; align-items: center; gap: 10px; padding: 12px 8px 2px; border-top: 1px solid var(--x-line); }
      .x-user__name { font-weight: 500; font-size: 13px; line-height: 1.3; }
      .x-user__role { font-size: 12px; color: var(--x-ink-3); }

      /* ---------- avatars ---------- */
      .x-av { width: 28px; height: 28px; border-radius: 50%; flex: none; object-fit: cover; display: grid; place-items: center; font-weight: 500; font-size: 12px; color: var(--x-ink-2); background: var(--x-hover); }
      .x-av--s { width: 24px; height: 24px; font-size: 12px; }
      .x-av--ai { background: var(--x-ink); color: #fff; }
      .x-av--ai .x-ico { width: 13px; height: 13px; }

      /* ---------- main / topbar ---------- */
      .x-main { min-width: 0; display: flex; flex-direction: column; }
      .x-top { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 24px; border-bottom: 1px solid var(--x-line); background: #fff; position: sticky; top: 0; z-index: 30; }
      .x-search { flex: 1; max-width: 380px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px 0 10px; border: 1px solid var(--x-line); border-radius: var(--x-r); color: var(--x-ink-3); }
      .x-search:focus-within { border-color: #d4d4d4; }
      .x-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 13px; color: var(--x-ink); }
      .x-search input::placeholder { color: var(--x-ink-3); }
      .x-kbd { font-family: "Geist Mono", monospace; font-size: 12px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--x-line); color: var(--x-ink-3); }
      .x-top__end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
      .x-iconbtn { position: relative; width: 34px; height: 34px; display: grid; place-items: center; border-radius: var(--x-r); color: var(--x-ink-2); }
      .x-iconbtn:hover { background: var(--x-soft); }
      .x-iconbtn__dot { position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--x-accent); }

      /* ---------- buttons, links, status ---------- */
      .x-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 0 12px; border: 1px solid transparent; border-radius: var(--x-r); font-weight: 500; font-size: 13px; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s; }
      .x-btn--primary { background: var(--x-accent); color: #fff !important; }
      .x-btn--primary:hover { background: var(--x-accent-ink); }
      .x-btn--ghost { background: #fff; border-color: var(--x-line); color: var(--x-ink) !important; }
      .x-btn--ghost:hover { background: var(--x-soft); }
      .x-btn--s { min-height: 28px; padding: 0 10px; }
      .x-link { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; color: var(--x-accent); font-size: 13px; font-weight: 500; text-decoration: none; }
      .x-link:hover { text-decoration: underline; text-underline-offset: 3px; }
      .x-st { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--x-ink-2); white-space: nowrap; }
      .x-st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--x-grey)); flex: none; }
      .x-st--run { --c: var(--x-accent); }
      .x-st--done { --c: var(--x-green); }
      .x-st--wait { --c: var(--x-amber); }
      .x-st--queue { --c: var(--x-grey); }

      /* ---------- screen ---------- */

      /* ---------- màn bổ sung (theo spec §8) ---------- */
      .x-pad { padding: 20px; }
      .x-grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .x-grow b { font-weight: 500; }
      .x-grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
      @media (max-width: 860px) { .x-grid2 { grid-template-columns: 1fr; } }
      .x-svc { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--x-ink-3); }
      .x-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .x-tabs-row { display: flex; gap: 4px; border-bottom: 1px solid var(--x-line); margin: 4px 0 0; overflow-x: auto; }
      .x-tab { padding: 8px 12px; font-size: 13px; color: var(--x-ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
      .x-tab:hover { color: var(--x-ink); }
      .x-tab.is-on { color: var(--x-ink); border-bottom-color: var(--x-accent); font-weight: 500; }
      .x-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
      .x-steps li { font-size: 12px; color: var(--x-ink-3); display: flex; flex-direction: column; gap: 6px; }
      .x-steps li span { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--x-line); display: grid; place-items: center; font-size: 11px; font-variant-numeric: tabular-nums; }
      .x-steps li.is-done span { background: var(--x-green); border-color: var(--x-green); color: #fff; }
      .x-steps li.is-now { color: var(--x-ink); font-weight: 500; }
      .x-steps li.is-now span { background: var(--x-accent); border-color: var(--x-accent); color: #fff; }
      @media (max-width: 760px) { .x-steps { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
      .x-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--x-line); border-radius: var(--x-r2); }
      .x-kpis > div { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
      .x-kpis > div + div { border-left: 1px solid var(--x-line); }
      .x-kpis span { font-size: 12px; color: var(--x-ink-3); }
      .x-kpis b { font-weight: 500; font-size: 18px; }
      .x-brief-dl { margin: 0; display: grid; gap: 10px; }
      .x-brief-dl div { display: flex; justify-content: space-between; gap: 12px; }
      .x-brief-dl dt { color: var(--x-ink-3); }
      .x-brief-dl dd { margin: 0; text-align: right; }
      .x-check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--x-ink-2); margin-bottom: 14px; }
      .x-area { width: 100%; border: 1px solid var(--x-line); border-radius: var(--x-r); padding: 10px 12px; resize: vertical; margin: 6px 0 12px; }
      .x-draft__view { aspect-ratio: 4 / 3; border-radius: var(--x-r); background: var(--x-soft); border: 1px dashed #d4d4d4; display: grid; place-items: center; margin-bottom: 12px; }
      .x-draft .x-chips { display: flex; gap: 6px; }
      .x-quote__act { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
      .x-steps { margin-bottom: 0; }
      .x-screen { padding: 28px 32px 56px; display: flex; flex-direction: column; gap: 28px; min-width: 0; }
      .x-screen--c-02 { max-width: 1080px; width: 100%; }
      .x-hello { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
      .x-hello h1 { font-size: 20px; }
      .x-hello__sub { color: var(--x-ink-3); font-size: 13px; margin-top: 2px; }
      .x-hello__end { margin-left: auto; }
      .x-label { font-size: 12px; color: var(--x-ink-3); }

      /* bordered box + section heads */
      .x-box { border: 1px solid var(--x-line); border-radius: var(--x-r2); min-width: 0; }
      .x-box__head { display: flex; align-items: baseline; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--x-line); }
      .x-sec__head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; min-height: 28px; }
      .x-box__head h2, .x-sec__head h2 { font-size: 14px; }
      .x-sec__head .x-link { margin-left: auto; }
      .x-count { font-size: 13px; color: var(--x-ink-3); font-variant-numeric: tabular-nums; }

      /* action rows */
      .x-rows { list-style: none; margin: 0; padding: 0; }
      .x-rows > li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--x-line); }
      .x-rows > li:first-child { border-top: 0; }
      .x-rows__body { flex: 1; min-width: 0; }
      .x-rows__title { font-size: 14px; font-weight: 500; line-height: 1.4; }
      .x-rows__sub { font-size: 13px; color: var(--x-ink-3); }
      .x-rows__note { flex: 1; min-width: 0; font-size: 13px; color: var(--x-ink-2); }

      /* orders table */
      .x-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .x-table th { text-align: left; font-weight: 400; font-size: 12px; color: var(--x-ink-3); padding: 0 12px 8px; border-bottom: 1px solid var(--x-line); white-space: nowrap; }
      .x-table td { padding: 11px 12px; border-bottom: 1px solid var(--x-line); vertical-align: middle; color: var(--x-ink-2); }
      .x-table th:first-child, .x-table td:first-child { padding-left: 0; }
      .x-table th:last-child, .x-table td:last-child { padding-right: 0; text-align: right; }
      .x-table__name { color: var(--x-ink); font-weight: 500; font-size: 14px; }
      .x-table__svc { display: block; font-size: 12px; color: var(--x-ink-3); }
      .x-who { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
      .x-bar { display: flex; align-items: center; gap: 10px; min-width: 120px; }
      .x-bar__track { flex: 1; height: 4px; border-radius: 2px; background: var(--x-hover); overflow: hidden; }
      .x-bar__track i { display: block; height: 100%; border-radius: 2px; background: var(--x-accent); }
      .x-bar__pct { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--x-ink-3); width: 36px; text-align: right; }
      .x-eta { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--x-ink-2); white-space: nowrap; }

      /* activity + month */
      .x-split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 40px; }
      .x-tl { list-style: none; margin: 0; padding: 0; }
      .x-tl li { display: grid; grid-template-columns: 44px 14px minmax(0, 1fr); gap: 0 10px; padding: 8px 0; }
      .x-tl time { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--x-ink-3); padding-top: 1px; }
      .x-tl__dot { position: relative; }
      .x-tl__dot::before { content: ""; position: absolute; left: 4px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: #d4d4d4; }
      .x-tl li:first-child .x-tl__dot::before { background: var(--x-accent); }
      .x-tl li:not(:last-child) .x-tl__dot::after { content: ""; position: absolute; left: 6.5px; top: 19px; bottom: -14px; width: 1px; background: var(--x-line); }
      .x-tl p { font-size: 13px; color: var(--x-ink-2); }
      .x-tl p b { color: var(--x-ink); }
      .x-stats { list-style: none; margin: 0; padding: 0; }
      .x-stats li { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--x-line); font-size: 13px; color: var(--x-ink-2); }
      .x-stats li:first-child { border-top: 0; padding-top: 4px; }
      .x-stats b { font-size: 14px; color: var(--x-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }

      /* empty + skeleton */
      .x-empty { padding: 16px; display: grid; justify-items: start; gap: 8px; color: var(--x-ink-3); font-size: 13px; }
      .x-sk { display: block; border-radius: 4px; background: linear-gradient(90deg, #f2f2f2 25%, #f8f8f8 50%, #f2f2f2 75%); background-size: 200% 100%; animation: x-shim 1.4s linear infinite; }
      @keyframes x-shim { to { background-position: -200% 0; } }
      .x-skrow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
      .x-skcol { flex: 1; display: grid; gap: 7px; }

      /* ---------- prototype switcher ---------- */
      .x-proto { position: fixed; bottom: 16px; right: 16px; z-index: 50; display: flex; gap: 8px; align-items: center; }
      .x-proto__pill, .x-states { background: #fff; border: 1px solid var(--x-line); border-radius: var(--x-r); }
      .x-proto__pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; font-size: 13px; }
      .x-proto__tag { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--x-ink-3); }
      .x-states { display: flex; padding: 2px; gap: 2px; }
      .x-states button { height: 28px; padding: 0 10px; border-radius: 4px; font-size: 12px; color: var(--x-ink-2); }
      .x-states button[aria-pressed="true"] { background: var(--x-hover); color: var(--x-ink); font-weight: 500; }
      .x-menu { position: absolute; bottom: 42px; right: 0; width: 280px; background: #fff; border: 1px solid var(--x-line); border-radius: var(--x-r2); padding: 6px; box-shadow: 0 12px 32px -12px rgba(0, 0, 0, .18); display: none; }
      .x-menu.is-open { display: block; }
      .x-menu__group { font-size: 12px; color: var(--x-ink-3); padding: 8px 8px 4px; }
      .x-menu button { display: flex; width: 100%; align-items: center; gap: 10px; min-height: 34px; padding: 6px 8px; border-radius: var(--x-r); text-align: left; font-size: 13px; }
      .x-menu button:hover:not(:disabled) { background: var(--x-soft); }
      .x-menu button.is-active { background: var(--x-hover); font-weight: 500; }
      .x-menu button:disabled { color: var(--x-ink-3); cursor: default; }
      .x-menu button .x-mono { color: var(--x-ink-3); width: 38px; }
      .x-menu__soon { margin-left: auto; font-size: 12px; color: var(--x-ink-3); }

      .x-toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 8px); opacity: 0; background: var(--x-ink); color: #fff; padding: 9px 14px; border-radius: var(--x-r); font-size: 13px; z-index: 80; pointer-events: none; transition: opacity .2s, transform .2s var(--x-ease); max-width: calc(100vw - 32px); }
      .x-toast.is-on { opacity: 1; transform: translate(-50%, 0); }

      /* ---------- bottom tabs (mobile) ---------- */
      .x-tabs { display: none; }

      /* ---------- responsive ---------- */
      @media (max-width: 900px) {
        .x-app { grid-template-columns: minmax(0, 1fr); }
        .x-side { display: none; }
        .x-top { height: 56px; padding: 0 16px; }
        .x-search { height: 44px; }
        .x-iconbtn { width: 44px; height: 44px; }
        .x-screen { padding: 20px 16px 150px; gap: 24px; }
        .x-split { grid-template-columns: minmax(0, 1fr); gap: 28px; }
        .x-proto { bottom: calc(72px + env(safe-area-inset-bottom)); right: 12px; }
        .x-proto__pill { height: 44px; }
        .x-states button { height: 44px; min-width: 44px; }
        .x-tabs { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #fff; border-top: 1px solid var(--x-line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
        .x-tabs button { display: grid; justify-items: center; gap: 2px; min-height: 52px; padding: 6px 2px; color: var(--x-ink-3); font-size: 12px; position: relative; }
        .x-tabs button.is-active { color: #5e5ce6; font-weight: 500; }
        .x-tabs .x-tabs__dot { position: absolute; top: 6px; left: calc(50% + 6px); width: 6px; height: 6px; border-radius: 50%; background: var(--x-accent); }
        .x-btn, .x-btn--s, .x-link { min-height: 44px; }
        .x-toast { bottom: calc(136px + env(safe-area-inset-bottom)); }
        #x-proto-name { display: none; }
      }
      @media (max-width: 700px) {
        .x-search .x-kbd { display: none; }
        .x-hello__end { margin-left: 0; width: 100%; }
        .x-hello__end .x-btn { width: 100%; }
        .x-rows > li { flex-wrap: wrap; }
        .x-rows > li > .x-btn { width: 100%; }
        .x-table thead { display: none; }
        .x-table, .x-table tbody { display: block; }
        .x-table tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 12px 0; border-bottom: 1px solid var(--x-line); }
        .x-table td { display: block; padding: 0 !important; border: 0; text-align: left !important; }
        .x-table td:nth-child(1) { grid-column: 1; grid-row: 1; }
        .x-table td:nth-child(4) { grid-column: 2; grid-row: 1; justify-self: end; }
        .x-table td:nth-child(2) { grid-column: 1; grid-row: 2; }
        .x-table td:nth-child(5) { grid-column: 2; grid-row: 2; justify-self: end; align-self: center; }
        .x-table td:nth-child(5)::before { content: "Giao "; font-family: "Geist", sans-serif; color: var(--x-ink-3); }
        .x-table td:nth-child(3) { grid-column: 1 / -1; grid-row: 3; }
      }
      @media (prefers-reduced-motion: reduce) {
        .x-root *, .x-root *::before, .x-root *::after { animation: none !important; transition: none !important; }
      }
      /* ---------- P-02 chat ---------- */
      .x-screen--p-02 { padding: 0; gap: 0; }
      .x-chat { display: grid; grid-template-columns: 260px minmax(0, 1fr) 280px; min-height: calc(100vh - 53px); }
      .x-convs { border-right: 1px solid var(--x-line); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .x-convs h2 { font-size: 14px; padding: 0 8px 10px; }
      .x-conv { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: var(--x-r); text-align: left; width: 100%; transition: background .15s; }
      .x-conv:hover { background: var(--x-soft); }
      .x-conv.is-active { background: var(--x-hover); }
      .x-conv__body { flex: 1; min-width: 0; }
      .x-conv__name { display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 13px; line-height: 1.3; }
