<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Studio UI Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
<style>
  :root{
    --canvas:#f6f5f1; --card:#fff; --line:rgba(28,27,23,.10); --line-2:rgba(28,27,23,.18);
    --ink:#1c1b17; --muted:#66635b; --accent:#2f45ff; --paid:#0b7a48; --tint:#efede7;
    --r:10px; --pill:999px; --sans:"Be Vietnam Pro",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--canvas);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .mono{font-family:var(--mono);font-size:12px;letter-spacing:.01em}
  .muted{color:var(--muted)}

  /* shell */
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  .rail{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;background:var(--canvas)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;padding:0 8px}
  .brand i{width:22px;height:22px;border-radius:6px;background:var(--ink);display:inline-block;position:relative}
  .brand i::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--canvas)}
  .rail h6{margin:0 8px 6px;font:500 12px/1 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .rail nav{display:flex;flex-direction:column;gap:2px}
  .rail nav button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 8px;border-radius:8px;min-height:40px}
  .rail nav button:hover{background:var(--tint)}
  .rail nav button[aria-current="true"]{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
  .rail nav .mono{color:var(--muted);width:34px}
  .rail-note{margin-top:auto;padding:0 8px;font-size:12px;color:var(--muted)}

  .stage{display:flex;flex-direction:column;min-width:0}
  .bar{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line)}
  .bar .title{font-weight:600}
  .bar select{display:none;flex:1;min-height:40px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);padding:0 10px}
  .seg{margin-left:auto;display:inline-flex;border:1px solid var(--line-2);border-radius:var(--pill);padding:3px;background:var(--card)}
  .seg button{border:0;background:none;padding:6px 14px;border-radius:var(--pill);min-height:32px;font-size:13px}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .view{flex:1;display:flex;justify-content:center;padding:28px 24px 48px}

  /* frames */
  .phone{width:390px;height:800px;max-height:calc(100vh - 120px);min-height:600px;background:var(--canvas);border:1px solid var(--line-2);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;position:relative}
  .phone .status{display:flex;justify-content:space-between;padding:12px 26px 6px;font:500 12px var(--sans)}
  .phone .scroll{flex:1;overflow:auto;padding:8px 16px 20px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--card);padding:6px 4px 14px}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);min-height:44px;padding-top:4px}
  .tabbar button svg{width:20px;height:20px}
  .tabbar button[aria-current="true"]{color:var(--ink);font-weight:600}
  .desk{width:100%;max-width:1040px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
  .desk .topnav{display:flex;align-items:center;gap:22px;padding:14px 22px;border-bottom:1px solid var(--line)}
  .desk .topnav button{border:0;background:none;color:var(--muted);padding:6px 0;min-height:36px}
  .desk .topnav button[aria-current="true"]{color:var(--ink);font-weight:600}
  .desk .scroll{padding:28px;background:var(--canvas)}

  /* atoms */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--card);border-radius:var(--pill);padding:0 18px;min-height:44px;font-weight:500;white-space:nowrap}
  .btn:hover{background:var(--tint)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
  .btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.block{width:100%}
  .tag{display:inline-flex;align-items:center;border-radius:var(--pill);padding:2px 9px;font-size:12px;font-weight:500;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
  .tag.ai{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tag.ai::before{content:"";width:6px;height:6px;border-radius:50%;background:#7cf0b4;margin-right:6px}
  .paid{color:var(--paid);font-weight:600}
  .sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px}
  .sec-h h3{margin:0;font-size:15px;font-weight:600}
  .sec-h span{font-size:12px;color:var(--muted)}
  .rows>div{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
  .rows>div:first-child{border-top:0}
  .rows .grow{flex:1;min-width:0}
  .rows .price{font-weight:600;white-space:nowrap}
  .ico{width:36px;height:36px;border-radius:9px;background:var(--tint);display:grid;place-items:center;flex:none}
  .ico svg{width:18px;height:18px}

  /* P-01 */
  .hero h1{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:14px 0 10px}
  .hero p{color:var(--muted);margin:0 0 18px;font-size:15px}
  .desk .hero h1{font-size:40px;max-width:620px}
  .flow{display:flex;flex-direction:column;gap:0;counter-reset:s}
  .flow li{list-style:none;display:flex;gap:12px;align-items:center;padding:10px 0;position:relative}
  .flow li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font:500 12px var(--mono);background:var(--card);flex:none;z-index:1}
  .flow li:not(:last-child)::after{content:"";position:absolute;left:13px;top:36px;bottom:-10px;border-left:1px solid var(--line-2)}
  .flow{padding:0;margin:0}
  .desk .flow{flex-direction:row;justify-content:space-between}
  .desk .flow li{flex-direction:column;flex:1;text-align:center;gap:8px}
  .desk .flow li:not(:last-child)::after{left:calc(50% + 13px);right:calc(-50% + 13px);top:23px;bottom:auto;border-left:0;border-top:1px solid var(--line-2)}
  .desk .p01{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}

  /* P-02 chat */
  .chat{display:flex;flex-direction:column;height:100%}
  .chat-head{display:flex;align-items:center;gap:10px;padding:6px 0 12px;border-bottom:1px solid var(--line)}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:600 12px var(--sans);flex:none}
  .msgs{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px 0;overflow:auto}
  .msg{max-width:86%;padding:10px 14px;border-radius:16px;font-size:14px}
  .msg.ai{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
  .msg.me{background:var(--ink);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
  .quote{align-self:flex-start;width:min(100%,340px);overflow:hidden}
  .quote header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .quote .spec{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px 4px}
  .quote dl{margin:0;padding:6px 14px 12px}
  .quote dl div{display:flex;justify-content:space-between;padding:5px 0}
  .quote dt{color:var(--muted)} .quote dd{margin:0;font-weight:600}
  .quote footer{padding:0 14px 14px}
  .chips{display:flex;gap:6px;overflow:auto;padding:4px 0 8px}
  .chips button{border:1px solid var(--line-2);background:var(--card);border-radius:var(--pill);padding:6px 12px;font-size:13px;white-space:nowrap;min-height:36px}
  .composer{display:flex;gap:8px;align-items:center;border:1px solid var(--line-2);background:var(--card);border-radius:var(--pill);padding:4px 4px 4px 16px}
  .composer input{flex:1;border:0;outline:0;background:none;min-height:40px;min-width:0}
  .composer .btn{min-height:40px;padding:0 14px}
  .phone .chat{flex:1;min-height:0;height:auto}
  .desk .chat{height:620px;max-width:720px;margin:0 auto}
  .typing{display:inline-flex;gap:4px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,100%{opacity:.3}50%{opacity:1}}

  /* C-02 */
  .todo>div{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--line)}
  .todo>div:first-child{border-top:0}
  .todo input{width:18px;height:18px;margin-top:2px;accent-color:var(--ink);flex:none}
  .todo .done .t{text-decoration:line-through;color:var(--muted)}
  .prog{height:6px;border-radius:var(--pill);background:var(--tint);overflow:hidden;margin:10px 0 8px}
  .prog i{display:block;height:100%;background:var(--ink);border-radius:inherit}
  .credit{display:flex;gap:4px;margin-top:10px}
  .credit i{flex:1;height:6px;border-radius:var(--pill);background:var(--ink)}
  .credit i.off{background:var(--tint)}
  .desk .c02{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
  .greet h2{margin:6px 0 2px;font-size:22px;font-weight:700;letter-spacing:-.01em}

  /* C-06 / C-09 / C-10 */
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .desk .c06{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start;max-width:820px}
  .phone .c06>*+*{margin-top:14px}
  .qr{padding:18px;text-align:center}
  .qr svg{width:100%;max-width:220px;display:block;margin:12px auto}
  .bank{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
  .bank b{background:#1b3fa0;color:#fff;border-radius:6px;padding:2px 6px;font:600 12px var(--mono)}
  .cd{font:500 22px var(--mono)}
  .val{font:500 15px var(--mono)}
  .copy{border:1px solid var(--line-2);background:var(--card);border-radius:var(--pill);min-height:36px;padding:0 12px;font-size:13px;flex:none}
  .copy:hover{background:var(--tint)}
  .warn{display:flex;gap:8px;align-items:center;margin:10px 0 0;background:#fdf1dc;color:#8a4f00;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:500}
  .note{font-size:12px;color:var(--muted);margin:10px 2px 0}
  .ok{text-align:center;padding:32px 20px;max-width:440px;margin:0 auto}
  .ok .tick{width:56px;height:56px;border-radius:50%;background:var(--paid);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
  .ok h2{margin:0 0 4px;font-size:20px}
  .ok p{margin:0 0 18px;color:var(--muted)}
  .flow li.done::before{content:"✓";background:var(--ink);border-color:var(--ink);color:#fff}
  .flow li.now{font-weight:600}
  .flow li.now::before{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px rgba(47,69,255,.15)}
  .flow li:not(.done):not(.now){color:var(--muted)}
  .desk .flow li{font-size:13px}
  .feed>div{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);animation:in .35s}
  .feed>div:first-child{border-top:0}
  .feed .mono{color:var(--muted);padding-top:2px;flex:none}
  @keyframes in{from{opacity:0;transform:translateY(6px)}}
  .art{position:relative;cursor:crosshair;overflow:hidden;padding:0}
  .art svg{display:block;width:100%;height:auto}
  .pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:600 12px var(--mono);box-shadow:0 0 0 3px #fff;pointer-events:none}
  .pnum{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:600 12px var(--mono);flex:none}
  .pins input{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:8px;min-height:40px;padding:0 10px;background:var(--card)}
  .aino{display:flex;gap:8px;align-items:center;background:var(--tint);border-radius:8px;padding:9px 12px;font-size:13px;margin:14px 0 0}
  .desk .c10{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
  dialog{border:1px solid var(--line);border-radius:var(--r);padding:20px;width:min(360px,calc(100% - 32px));color:var(--ink);background:var(--card)}
  dialog::backdrop{background:rgba(28,27,23,.35)}
  dialog p{margin:0 0 18px;font-size:15px}
  dialog .acts{display:flex;gap:8px;justify-content:flex-end}

  /* Quản trị */
  .admx{width:100%;max-width:1040px;overflow-x:auto}
  .adm{min-width:960px}
  .adm .atop{height:60px;flex:none;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--line);font-weight:600}
  .adm .atop .mono{margin-left:auto;font-weight:400}
  .admm{width:390px;max-width:100%;height:800px;max-height:calc(100vh - 120px);min-height:600px;overflow:auto;border:1px solid var(--line-2);border-radius:36px;background:var(--canvas)}
  .admm .adm{zoom:.5;width:1040px;max-width:none;border:0;border-radius:0}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .kpi{padding:14px 16px}
  .kpi b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;margin:4px 0 2px;white-space:nowrap}
  .kpi span,.kpi small{font-size:12px;color:var(--muted)}
  .up{color:var(--paid);font-weight:600}
  .a2{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
  .csvg{display:block;width:100%;height:auto;font:400 13px var(--sans);fill:var(--muted)}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .sev{width:8px;height:8px;border-radius:50%;flex:none;background:#c98a00}
  .sev.hi{background:#c62828}
  .atabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 16px}
  .atabs button{border:0;background:none;padding:10px 12px;min-height:44px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .atabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-color:var(--ink)}
  .a3{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
  .qlist button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:14px 16px}
  .qlist button:first-child{border-top:0}
  .qlist button[aria-pressed="true"]{background:var(--tint);box-shadow:inset 3px 0 0 var(--accent)}
  .pv{overflow:hidden}.pv svg{display:block;width:100%;height:auto}
  .qc{list-style:none;margin:0;padding:0}
  .qc li{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}
  .qc li:first-child{border-top:0}
  .qc .y{color:var(--paid);font-weight:600}.qc .n{color:#c62828;font-weight:600}
  .acts2{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  kbd{font:500 12px var(--mono);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;background:var(--card)}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th,.tbl td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
  .tbl thead th{border-top:0;font-size:12px;font-weight:500;color:var(--muted)}
  .tbl .r{text-align:right;font-family:var(--mono);white-space:nowrap}
  .tbl tr.sub td{background:var(--canvas);padding:8px 14px 12px 40px}
  .tbl a{color:var(--accent);text-decoration:none;white-space:nowrap}
  .exp{border:0;background:none;padding:0;font-weight:600;display:inline-flex;gap:8px;align-items:center;min-height:36px}
  .exp::before{content:"▸";color:var(--muted);transition:.15s}
  .exp[aria-expanded="true"]::before{transform:rotate(90deg)}
  .tag.live{border-color:var(--accent);color:var(--accent)}
  pre.json{margin:0;padding:18px;font:400 13px/1.6 var(--mono);overflow:auto}
  dialog label{display:block;font-size:13px;font-weight:500}
  dialog select,dialog textarea{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;background:var(--card);margin:4px 0 12px;min-height:40px;font:inherit}

  /* Nhà cung cấp */
  .vlist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .voffer{overflow:hidden;animation:in .35s}
  .voffer header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .voffer header b{display:block;font-weight:600}
  .vcd{color:#8a4f00;background:#fdf1dc;border-radius:var(--pill);padding:3px 9px;white-space:nowrap;flex:none}
  .vlab{margin:0;font-size:12px;color:var(--muted)}
  .voffer .vbrief{padding:12px 14px 4px}
  .voffer .vbrief p+p{margin:4px 0 0}
  .voffer dl{margin:0;padding:6px 14px 10px}
  .voffer dl div{display:flex;justify-content:space-between;padding:5px 0}
  .voffer dt{color:var(--muted)} .voffer dd{margin:0;font-weight:600}
  .voffer footer{display:flex;gap:8px;padding:0 14px 14px}
  .voffer footer .btn{flex:1}
  .vempty{padding:36px 20px;text-align:center;color:var(--muted)}
  .vform{padding:16px;display:grid;gap:14px}
  .vform label,.vlegend{display:block;font-size:13px;font-weight:500;margin:0 0 4px;padding:0}
  .vin{width:100%;border:1px solid var(--line-2);border-radius:8px;min-height:44px;padding:0 12px;background:var(--card);min-width:0}
  .vrow{display:flex;gap:8px}
  .vok{display:inline-flex;align-items:center;gap:6px;background:#e3f3ea;color:var(--paid);border-radius:var(--pill);padding:3px 10px;font-size:12px;font-weight:600}
  .vskills{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
  .vskills li{font:400 12px var(--mono);background:var(--tint);border-radius:6px;padding:3px 8px}
  .vcaps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;border:0;margin:0;padding:0;min-width:0}
  .vcaps label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:44px;margin:0;font-weight:400;cursor:pointer}
  .vcaps input{width:18px;height:18px;accent-color:var(--ink);margin:0;flex:none}
  .vfields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .vchips{display:flex;flex-wrap:wrap;gap:6px;border:0;margin:0 0 16px;padding:0}
  .vchips legend{font-size:13px;font-weight:500;margin-bottom:8px;padding:0}
  .vchips label{position:relative;margin:0}
  .vchips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
  .vchips span{display:inline-flex;align-items:center;border:1px solid var(--line-2);background:var(--card);border-radius:var(--pill);padding:0 14px;min-height:40px;font-size:13px;font-weight:400}
  .vchips input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
  .vchips input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
  .desk .v02{max-width:640px}
  @media (max-width:760px){.vfields{grid-template-columns:1fr}}
  .phone .vfields{grid-template-columns:1fr}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--pill);font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
  .toast.on{opacity:1;transform:translateX(-50%)}

  @media (max-width:760px){
    .app{grid-template-columns:1fr}
    .rail{display:none}

/* C-06 */
function qrSvg() {
  const N = 25, fin = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
  let s = 7, d = "";
  const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!fin(x, y) && r() > .5) d += `M${x} ${y}h1v1h-1z`;
  const f = (x, y) => `M${x} ${y}h7v7h-7zM${x + 1} ${y + 1}v5h5v-5zM${x + 2} ${y + 2}h3v3h-3z`;
  return `<svg viewBox="-2 -2 29 29" role="img" aria-label="Mã VietQR chuyển khoản" shape-rendering="crispEdges">
    <rect x="-2" y="-2" width="29" height="29" fill="#fff"/><path fill="#1c1b17" fill-rule="evenodd" d="${d}${f(0, 0)}${f(18, 0)}${f(0, 18)}"/></svg>`;
}
function cdText() {
  const t = Math.max(0, Math.ceil((state.qrEnd - Date.now()) / 1000));

}

  $("#screenSelect").value = sc.id;
  $("#barTitle").innerHTML = `<span class="mono muted">${sc.id}</span> &nbsp;${sc.name}`;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
  const body = sc.render();
  if (sc.admin) {
    const a = `<div class="desk adm"><div class="atop">Bảng quản trị · Hôm nay 28/10/2026<span class="mono muted">Quản trị viên</span></div><div class="scroll">${body}</div></div>`;
    $("#view").innerHTML = state.mode === "mobile" ? `<div class="admm" tabindex="0" aria-label="Bố cục desktop thu nhỏ, cuộn để xem">${a}</div>` : `<div class="admx">${a}</div>`;
  } else if (sc.vendor) {
    $("#view").innerHTML = state.mode === "mobile" ? `<div class="phone"><div class="status"><span>9:41</span><span>5G ▮▮▮</span></div>
      <div class="scroll">${body}</div>
      <nav class="tabbar" style="grid-template-columns:repeat(2,1fr)" aria-label="Điều hướng nhà cung cấp">${VTABS.map(t => `<button data-go="${t.screen}" aria-current="${t.id === sc.vendor}">${I[t.icon]}${t.label}</button>`).join("")}</nav></div>`
      : `<div class="desk"><div class="topnav"><div class="brand" style="padding:0;margin-right:12px"><i></i>AI Studio · Nhà cung cấp</div>
      ${VTABS.map(t => `<button data-go="${t.screen}" aria-current="${t.id === sc.vendor}">${t.label}</button>`).join("")}</div><div class="scroll">${body}</div></div>`;
  } else if (state.mode === "mobile") {
    $("#view").innerHTML = `<div class="phone"><div class="status"><span>9:41</span><span>5G ▮▮▮</span></div>
      <div class="scroll" ${sc.id === "P-02" ? 'style="display:flex;flex-direction:column"' : ""}>${body}</div>
      <nav class="tabbar" aria-label="Điều hướng ứng dụng">${TABS.map(t => `<button data-go="${t.screen}" aria-current="${t.id === sc.tab}">${I[t.id]}${t.label}</button>`).join("")}</nav></div>`;
  } else {
    $("#view").innerHTML = `<div class="desk"><div class="topnav"><div class="brand" style="padding:0;margin-right:12px"><i></i>AI Studio</div>
      ${TABS.slice(0, 3).map(t => `<button data-go="${t.screen}" aria-current="${t.id === sc.tab}">${t.label}</button>`).join("")}
      <button data-go="C-02" style="margin-left:auto">Tài khoản</button></div><div class="scroll">${body}</div></div>`;
  }
  const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight;
}

function go(id) { state.screen = id; history.replaceState(null, "", "#" + id); render(); }
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 1800); }

function send(text) {
  text = text.trim(); if (!text) return;
  state.msgs.push({ who: "me", text }, { who: "typing" }); render();
  setTimeout(() => {
    state.msgs.pop();
    state.msgs.push({ who: "ai", text: `Đã ghi nhận “${text}”. Mình sẽ cập nhật báo giá và chuyển cho chuyên viên duyệt trong ít phút.` });
    if (state.screen === "P-02") render();
  }, 900);
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return go(g.dataset.go);
  const m = e.target.closest("[data-mode]"); if (m) { state.mode = m.dataset.mode; return render(); }
  const c = e.target.closest("[data-chip]"); if (c) return send(c.dataset.chip);
  const t = e.target.closest("[data-toast]"); if (t) return toast(t.dataset.toast);
  const at = e.target.closest("[data-atab]"); if (at) { ADM.tab = +at.dataset.atab; return render(); }
  const jt = e.target.closest("[data-jtab]"); if (jt) { ADM.jtab = +jt.dataset.jtab; return render(); }
  const qs = e.target.closest("[data-qsel]"); if (qs) { ADM.sel = qs.dataset.qsel; return render(); }
  const ex = e.target.closest("[data-exp]"); if (ex) { ADM.open[ex.dataset.exp] = !ADM.open[ex.dataset.exp]; return render(); }
  const q = e.target.closest("[data-q]");
  if (q) return q.dataset.q === "approve" ? qDone(it => `Đã duyệt & gửi khách: ${it.name}`) : ($("#rejF").reset(), $("#rej").showModal());
  if (e.target.closest("[data-rej]")) return $("#rej").close();
  const va = e.target.closest("[data-vacc]"); if (va) return vDrop(va.dataset.vacc, "Đã nhận, job chuyển vào không gian làm việc");
  const vr = e.target.closest("[data-vrej]"); if (vr) { VEN.rej = vr.dataset.vrej; $("#vrejF").reset(); return $("#vrej").showModal(); }
  if (e.target.closest("[data-vrejx]")) return $("#vrej").close();
  if (e.target.closest("[data-vchk]")) {
    VEN.check = 1; render();
    return setTimeout(() => { VEN.check = 2; if (state.screen === "V-02") render(); }, 1000);
  }
  if (e.target.closest("[data-vsub]")) {
    const miss = [["floor", "vfloor"], ["sla", "vsla"], ["cap", "vcap"]].find(f => !String(VEN[f[0]]).trim());
    if (!Object.values(VEN.caps).some(Boolean)) return toast("Chọn ít nhất một năng lực");
    if (miss) { $("#" + miss[1]).focus(); return toast("Điền đủ Giá sàn, SLA và Sức chứa"); }
    return toast("Đã gửi, chờ job thử");
  }
  if (e.target.closest('[data-act="accept"]')) {
    state.accepted = true;
    state.msgs.push({ who: "ai", text: `Cảm ơn bạn! Quét mã QR để cọc ${fmt(645000)}, đơn bắt đầu ngay khi nhận cọc.` });
    go("C-06"); toast("Đã chấp nhận báo giá Q-2610-031");
  }
  const d = e.target.closest("[data-dlg]");
  if (d) { $("#dlg").close(); if (d.dataset.dlg === "1" && dlgCb) dlgCb(); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) { navigator.clipboard?.writeText(cp.dataset.copy).catch(() => {}); return toast("Đã sao chép " + cp.dataset.copy); }
  if (e.target.closest('[data-act="paid"]')) { state.paid = true; render(); return toast("Ngân hàng đã xác nhận giao dịch"); }
  const vb = e.target.closest("[data-ver]"); if (vb) { state.ver = +vb.dataset.ver; return render(); }
  const art = e.target.closest("#art");
  if (art) { const r = art.getBoundingClientRect(); return addPin(+((e.clientX - r.left) / r.width * 100).toFixed(1), +((e.clientY - r.top) / r.height * 100).toFixed(1)); }
  if (e.target.closest('[data-act="approve"]')) return ask(`Sau khi duyệt, thanh toán phần còn lại ${fmt(645000)} để nhận file gốc`, "Duyệt bản này", () => {
    state.approved = true; state.todos[0] = true; render(); toast(`Đã duyệt bản v${state.ver}`); });
  if (e.target.closest('[data-act="revise"]')) return ask(`Sẽ dùng 1 lượt, còn lại ${state.rev - 1}`, "Gửi yêu cầu", () => {
    state.rev--; state.pins = state.pins.filter(p => p.text.trim()).map(p => ({ ...p, edit: false }));
    render(); toast(`Đã gửi ${state.pins.length} góp ý · còn ${state.rev} lượt sửa`); });
});
document.addEventListener("input", e => { if (e.target.dataset.vf) VEN[e.target.dataset.vf] = e.target.value;
  if (e.target.dataset.vcap) VEN.caps[e.target.dataset.vcap] = e.target.checked; if (e.target.dataset.pin != null) state.pins[+e.target.dataset.pin].text = e.target.value; });
document.addEventListener("keydown", e => {
  if (e.target.id === "art" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); addPin(50, 50); }
  if (e.target.dataset.pin != null && e.key === "Enter") e.target.blur();
  if (state.screen === "A-03" && !ADM.tab && ADM.q.length && !e.ctrlKey && !e.metaKey && !e.altKey
    && !document.querySelector("dialog[open]") && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) {
    const k = e.key.toLowerCase();
    if (k === "a") qDone(it => `Đã duyệt & gửi khách: ${it.name}`);
    else if (k === "r") { $("#rejF").reset(); $("#rej").showModal(); }
    else if (k === "j") qMove(1);
    else if (k === "k") qMove(-1);
  }
});
setInterval(() => { const c = $("#cd"); if (c) c.textContent = cdText(); }, 1000);
setInterval(() => {
  VEN.offers.forEach(o => { const el = document.querySelector(`[data-ocd="${o.id}"]`); if (el) el.textContent = vcd(o); });
  const gone = VEN.offers.find(o => o.end <= Date.now()); if (gone) vDrop(gone.id, `Offer “${gone.cap}” đã tự hết hạn`);
}, 1000);
setInterval(() => {
  if (state.screen !== "C-09" || state.feed >= EVENTS.length) return;
  const f = $("#feed"); if (f) f.insertAdjacentHTML("beforeend", evRow(EVENTS[state.feed++]));
}, 4000);
document.addEventListener("change", e => {
  if (e.target.id === "screenSelect") go(e.target.value);
  if (e.target.dataset.todo != null) { state.todos[+e.target.dataset.todo] = e.target.checked; render(); }
});
document.addEventListener("submit", e => {
  if (e.target.id === "composer") { e.preventDefault(); const v = $("#msgIn").value; send(v); }
  if (e.target.id === "vrejF") { e.preventDefault(); const r = new FormData(e.target).get("vr"); $("#vrej").close(); vDrop(VEN.rej, `Đã từ chối offer · ${r}`); }
  if (e.target.id === "rejF") { e.preventDefault(); const r = $("#rejR").value; $("#rej").close(); qDone(it => `Đã từ chối ${it.name} · ${r} · đã gửi ghi chú cho agent`); }
});

buildNav();
const h = location.hash.slice(1); if (SCREENS.some(s => s.id === h)) state.screen = h;
render();
</script>
</body>
</html>
